name: Stale

on:
  schedule:
    - cron: "30 4 * * *"
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          days-before-stale: 60
          days-before-close: 14
          stale-issue-message: >
            Dieses Issue hatte 60 Tage lang keine Aktivität und wird in 14 Tagen
            geschlossen, wenn nichts mehr passiert.
          stale-pr-message: >
            Dieser Pull Request hatte 60 Tage lang keine Aktivität und wird in
            14 Tagen geschlossen, wenn nichts mehr passiert.
          exempt-issue-labels: pinned,security,feature
          exempt-pr-labels: pinned,security
