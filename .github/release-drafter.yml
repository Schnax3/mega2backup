name-template: "v$RESOLVED_VERSION"
tag-template: "v$RESOLVED_VERSION"
categories:
  - title: "🚀 Neue Funktionen"
    labels: [feature, enhancement]
  - title: "🐛 Fehlerbehebungen"
    labels: [fix, bugfix, bug]
  - title: "🧰 Wartung"
    labels: [chore, dependencies, ci]
  - title: "📚 Dokumentation"
    labels: [documentation]
change-template: "- $TITLE (#$NUMBER) @$AUTHOR"
change-title-escapes: '\<*_&@'
version-resolver:
  major:
    labels: [major]
  minor:
    labels: [feature, enhancement]
  patch:
    labels: [fix, bugfix, bug, chore, dependencies, ci, documentation]
  default: patch
autolabeler:
  - label: feature
    title: ["/^feat/i"]
  - label: fix
    title: ["/^fix/i"]
  - label: documentation
    title: ["/^docs/i"]
  - label: chore
    title: ["/^(chore|ci|refactor)/i"]
template: |
  ## Änderungen

  $CHANGES
